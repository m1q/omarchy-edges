# omarchy-edges
# Reload after editing:  systemctl --user reload omarchy-edges
# (changing "device" needs: systemctl --user restart omarchy-edges)

# Touchpad to use: "auto" picks the first touchpad, or give /dev/input/eventN.
device = auto

# What each side edge controls: volume, brightness or none.
left  = brightness
right = volume

# Width of the side bands, as a fraction of the touchpad width (0.06 = 6%).
edge_width = 0.06

# Only start slides in the lower part of the pad (1.0 = anywhere, 0.25 = bottom quarter).
active_area = 1.0

# How far you slide for a full 0..100% sweep, as a fraction of the pad height.
travel = 0.8

# Level granularity in percent.
step = 2

# Double-tap the top-right corner to mute / unmute.
quick_mute = true

# Swipe along the bottom edge: right = next track, left = previous.
media_strip = true
media_reverse = false
# Double-tap the bottom edge to play / pause.
media_double_tap = false
bottom_height = 0.08

# Show the Omarchy OSD while sliding.
osd = true

# Gesture tuning (millimetres / milliseconds).
claim_mm = 1.5
release_mm = 3.0
swipe_mm = 12
tap_ms = 250
double_tap_ms = 350

debug = false
